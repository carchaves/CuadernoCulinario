# app name se completa al correr `fly launch` / `fly apps create`
app = "cocina-app-server"
primary_region = "gru"

[build]
  dockerfile = "server/Dockerfile"

[deploy]
  # release_command = "npx prisma migrate deploy"
  # Temporalmente deshabilitado: la migración inicial ya está aplicada en Neon, y este
  # comando quedó colgado (timeout) en dos despliegues seguidos por una falla transitoria
  # de infraestructura de Fly, sin relación con la app. Reactivar cuando haya una migración
  # nueva que aplicar.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
